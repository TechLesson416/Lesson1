<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel ="styleshhet" href="static/css/style.css">
    <title>Форма регистрации</title>
</head>
<body>
<h1>Регистрация в системе</h1>>
<div>
  <form class="login_Form" method="post">
      <input type="email" class="form-control" id="email" aria-describedby="emailHelp" placeholder="Введите E-mail" name="email">
      <input type="password" class="form-control" id="password"  placeholder="Введите пароль" name="password">
    <label>Уровень владения ПК</label>
    <select name="level id=levelSelect">
        <option>=Высокий></option>
        <option>=Средний></option>
        <option>=Низкий></option>
    </select>
    <div class="form-group"> id="form-group">
      <label for="about">< Расскажите о себе ></label>
      <label for="form-label" >< Укажите пол ></label>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="gender" id="sex" value="M" checked>
        <label class="form-check-label" for="Male">Мужской</label>
        </div>
    </div>
    <div class="form-group form-check">
      <input class="form-check-input" type="checkbox" name="accept" id="acceptRules">Согласен с правилвами>
        <label class="form-check-label" for="acceptRules">
      <input type="checkbox" name="accept" id="acceptRules">
      <label for="acceptRules"></label>
        <div class="form-check">
        <input class="form-check-input" type="radio" name="gender" id="sex" value="F" checked>
        <label class="form-check-label" for="Female">Женский</label>
      <textarea class="form-control" rows = "5" id="about" name="about"></textarea>
      </div>
   </form>
  </div>
</body>
</html>
